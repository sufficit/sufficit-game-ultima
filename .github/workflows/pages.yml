name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and enforce the file line limit
        run: |
          python3 tests/check_file_size_test.py
          python3 scripts/check-file-size.py

  build:
    needs: file-size
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar pacotes de modelos 3D (DLLs carregadas em runtime)
        run: bash scripts/build-models.sh

      - name: Preparar catálogo de assets GLB CC0 (SHA-256)
        run: bash scripts/build-assets.sh

      - name: Compilar motor do terreno em WebAssembly
        run: |
          dotnet workload install wasm-tools
          bash scripts/build-terrain.sh

      - name: Publicar Blazor WebAssembly
        run: dotnet publish src/Ultima.csproj -c Release -o publish

      - name: Ajustar base href para o caminho do Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll
          sed -i "s|__BUILD__|${GITHUB_SHA}|g" publish/wwwroot/index.html publish/wwwroot/404.html
          mkdir -p publish/wwwroot/environments
          cp publish/wwwroot/index.html publish/wwwroot/environments/index.html
          echo "{\"build\":\"${GITHUB_SHA}\"}" > publish/wwwroot/build.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
